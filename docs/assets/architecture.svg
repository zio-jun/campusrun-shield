<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="150" y="34" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">攻击测试床（软件）</text>
  <text x="720" y="34" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">防护参考实现（库）</text>

  <!-- 攻击端 -->
  <rect x="30" y="60" width="240" height="86" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="150" y="92" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">方式 A · 本机注入</text>
  <text x="150" y="114" font-size="11.5" fill="#7f1d1d" text-anchor="middle">Gadget + 定位 SDK Hook</text>
  <text x="150" y="132" font-size="11" fill="#b91c1c" text-anchor="middle">需重打包 · 触发壳校验</text>

  <rect x="30" y="162" width="240" height="86" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="150" y="194" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">方式 B · 虚拟机</text>
  <text x="150" y="216" font-size="11.5" fill="#7f1d1d" text-anchor="middle">redroid / 模拟器 + frida-server</text>
  <text x="150" y="234" font-size="11" fill="#b91c1c" text-anchor="middle">可伪造传感器 · 有模拟器指纹</text>

  <rect x="30" y="264" width="240" height="86" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="150" y="296" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">方式 C · 容器虚拟环境</text>
  <text x="150" y="318" font-size="11.5" fill="#7f1d1d" text-anchor="middle">双开 / VMOS / VirtualApp</text>
  <text x="150" y="336" font-size="11" fill="#b91c1c" text-anchor="middle">免重打包 · 目标未检测环境</text>

  <!-- 防御端 -->
  <rect x="580" y="60" width="300" height="290" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="730" y="88" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">客户端（第一道过滤）</text>
  <rect x="600" y="100" width="260" height="40" rx="8" fill="#dbeafe"/>
  <text x="730" y="125" font-size="12" fill="#1e40af" text-anchor="middle">反 mock · 反注入 · 反模拟器 · 完整性自校验</text>
  <rect x="600" y="148" width="260" height="40" rx="8" fill="#dbeafe"/>
  <text x="730" y="173" font-size="12" fill="#1e40af" text-anchor="middle">容器 / 多开特征检测（方式 C 缺口）</text>

  <text x="730" y="214" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">服务端（真相裁决者）</text>
  <rect x="600" y="224" width="260" height="40" rx="8" fill="#dbeafe"/>
  <text x="730" y="249" font-size="12" fill="#1e40af" text-anchor="middle">轨迹物理 · 地图匹配 · 重放检测</text>
  <rect x="600" y="272" width="260" height="40" rx="8" fill="#dbeafe"/>
  <text x="730" y="297" font-size="12" fill="#1e40af" text-anchor="middle">步频 × 速度交叉 · 时间一致性 · 人脸证据</text>

  <!-- 箭头 -->
  <line x1="272" y1="103" x2="596" y2="120" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="272" y1="205" x2="596" y2="200" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="272" y1="307" x2="596" y2="280" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <text x="460" y="392" font-size="12.5" fill="#374151" text-anchor="middle">攻击端回答「能不能作弊」，防护端回答「在哪一层拦住」</text>
  <text x="460" y="418" font-size="12.5" fill="#374151" text-anchor="middle">本仓库同时交付两侧，形成可复现、可度量的红蓝闭环</text>
  <text x="460" y="446" font-size="11.5" fill="#9ca3af" text-anchor="middle">CampusRun Shield · MIT License</text>
</svg>
