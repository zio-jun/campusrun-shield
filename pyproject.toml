[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "campusrun-shield"
version = "0.3.0"
description = "校园跑安全盾：攻防全景矩阵 + 防御参考实现 + sentinel 评估工具（纯标准库）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zio-jun" }]
keywords = ["security", "anti-cheat", "campus-run", "android-hardening", "trajectory"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools]
packages = ["sentinel"]

[tool.setuptools.package-data]
sentinel = ["rules/*.json"]
